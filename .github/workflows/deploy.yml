name: Deploy calendario verifiche

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inietta Groq API key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_KEY" ]; then
            echo "⚠️  Secret GROQ_API_KEY non configurato: AI disabilitata"
          else
            sed -i "s|__GROQ_API_KEY__|$GROQ_KEY|g" index.html
            echo "✓ API key Groq iniettata nel file index.html"
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito come artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
